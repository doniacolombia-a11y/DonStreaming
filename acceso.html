<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#090b16">
  <title>Tus accesos</title>
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#090b16; --card:#141831; --card2:#1c2143; --line:#272d55; --txt:#eef0ff; --mut:#959bc4; --acc:#ff6a2b; --ok:#22c55e; --warn:#f5b301; --bad:#f04646; }
    @media (prefers-color-scheme: light) { :root { --bg:#f3f4fa; --card:#fff; --card2:#f2f3fa; --line:#e3e5f1; --txt:#141733; --mut:#5f6590; --warn:#c58a00; } }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font: 15px/1.5 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--txt); background: radial-gradient(900px 500px at 100% -10%, rgba(255,106,43,.16), transparent 60%), var(--bg); min-height: 100vh; padding: 28px 16px 40px; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 520px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 22px; }
    header .neg { display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--acc); background: rgba(255,106,43,.13); padding: 5px 12px; border-radius: 999px; }
    header h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin-top: 12px; }
    header p { color: var(--mut); margin-top: 4px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-bottom: 14px; box-shadow: 0 14px 34px rgba(0,0,0,.18); }
    .card-h { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .sv { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px; flex: none; }
    .card-h b { font-size: 19px; display: block; }
    .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-top: 2px; }
    .ok { background: rgba(34,197,94,.14); color: var(--ok); } .warn { background: rgba(245,179,1,.15); color: var(--warn); } .bad { background: rgba(240,70,70,.14); color: var(--bad); }
    .f { display: flex; align-items: center; gap: 10px; background: var(--card2); border-radius: 13px; padding: 10px 12px; margin-top: 8px; }
    .f span { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); width: 66px; flex: none; }
    .f code { flex: 1; min-width: 0; font: 600 15px/1.3 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; overflow-wrap: anywhere; }
    .f button { border: 1px solid var(--line); background: var(--card); color: var(--txt); border-radius: 10px; padding: 7px 11px; font-weight: 700; font-size: 13px; font-family: inherit; cursor: pointer; flex: none; }
    .f button:active { transform: scale(.96); }
    .note { font-size: 13.5px; color: var(--mut); background: var(--card2); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
    .note b { color: var(--txt); }
    .note ol { padding-left: 18px; margin-top: 6px; }
    .wa { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: 14px; background: #25d366; color: #06301a; font-weight: 800; text-decoration: none; font-size: 15px; }
    .err { text-align: center; padding: 50px 10px; color: var(--mut); }
    .err b { display: block; color: var(--txt); font-size: 20px; margin-bottom: 6px; }
    footer { text-align: center; color: var(--mut); font-size: 12px; margin-top: 18px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--txt); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.on { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <div class="toast" id="toast">Copiado ✅</div>
  <script>
    window.addEventListener('hashchange', function () { location.reload(); });
    (function () {
      var app = document.getElementById('app');
      function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
      function sigla(n) { var w = String(n || '?').replace(/[^\p{L}\p{N} ]/gu, '').trim().split(/\s+/); return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || '?')[0]).toUpperCase(); }
      var MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
      function fecha(s) { if (!s) return '—'; var p = s.split('-'); return +p[2] + ' ' + MES[+p[1] - 1] + ' ' + p[0]; }
      function dias(s) { var p = s.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2], 12); var h = new Date(); h.setHours(12, 0, 0, 0); return Math.round((d - h) / 864e5); }
      function estado(v) { var d = dias(v); if (d < 0) return ['bad', 'Vencido hace ' + (-d) + ' d']; if (d === 0) return ['warn', 'Vence hoy']; if (d <= 3) return ['warn', 'Vence en ' + d + ' d']; return ['ok', 'Activo · vence en ' + d + ' d']; }
      var data;
      try {
        var h = location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/');
        while (h.length % 4) h += '=';
        data = JSON.parse(decodeURIComponent(escape(atob(h))));
        if (!data || !data.i || !data.i.length) throw 0;
      } catch (e) {
        app.innerHTML = '<div class="err"><b>Enlace no válido</b>Pide de nuevo tus accesos a quien te vendió el servicio.</div>';
        return;
      }
      document.title = 'Tus accesos · ' + (data.n || '');
      var html = '<header><span class="neg">' + esc(data.n || 'Tus accesos') + '</span><h1>' + (data.c ? '¡Hola ' + esc(data.c) + '! 👋' : '¡Hola! 👋') + '</h1><p>Estos son tus datos para entrar. Puedes abrir este enlace en tu celular, PC, portátil o tablet.</p></header>';
      data.i.forEach(function (it, n) {
        var st = estado(it.v);
        html += '<div class="card"><div class="card-h"><span class="sv" style="background:' + esc(it.co) + '">' + esc(sigla(it.s)) + '</span><div><b>' + esc(it.s) + '</b><span class="chip ' + st[0] + '">' + st[1] + '</span></div></div>';
        if (it.e) html += '<div class="f"><span>Correo</span><code>' + esc(it.e) + '</code><button data-copy="' + esc(it.e) + '">Copiar</button></div>';
        if (it.k) html += '<div class="f"><span>Clave</span><code data-secret="' + esc(it.k) + '" id="k' + n + '">••••••••</code><button data-ver="k' + n + '">Ver</button><button data-copy="' + esc(it.k) + '">Copiar</button></div>';
        if (it.p) html += '<div class="f"><span>Perfil</span><code>' + esc(it.p) + '</code></div>';
        if (it.pin) html += '<div class="f"><span>PIN</span><code>' + esc(it.pin) + '</code><button data-copy="' + esc(it.pin) + '">Copiar</button></div>';
        if (it.a) html += '<div class="f" style="align-items:flex-start"><span>Datos</span><code style="white-space:pre-wrap">' + esc(it.a) + '</code><button data-copy="' + esc(it.a) + '">Copiar</button></div>';
        html += '<div class="f"><span>Vence</span><code>' + fecha(it.v) + '</code></div></div>';
      });
      html += '<div class="note"><b>Cómo entrar</b><ol><li>Abre la app o la página del servicio.</li><li>Inicia sesión con el correo y la clave.</li><li>Elige <b>solo tu perfil</b>' + (data.i.some(function (x) { return x.pin; }) ? ' y escribe tu PIN' : '') + '.</li></ol></div>';
      html += '<div class="note">⚠️ No cambies el correo, la clave ni los perfiles de otras personas. Si algo falla, escríbenos antes de hacer cambios.</div>';
      if (data.w) html += '<a class="wa" href="https://wa.me/' + esc(data.w) + '?text=' + encodeURIComponent('Hola, necesito ayuda con mi acceso a ' + data.i.map(function (x) { return x.s; }).join(', ')) + '" target="_blank" rel="noopener">Escribir a soporte por WhatsApp</a>';
      html += '<footer>No compartas este enlace: contiene tus datos de acceso.</footer>';
      app.innerHTML = html;
      var t = document.getElementById('toast'), tt;
      function aviso(m) { t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('on'); }, 1600); }
      document.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.dataset.copy != null) {
          var v = b.dataset.copy;
          (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(function () { aviso('Copiado ✅'); }, function () {
            var ta = document.createElement('textarea'); ta.value = v; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (x) {} ta.remove(); aviso('Copiado ✅');
          });
        }
        if (b.dataset.ver) { var c = document.getElementById(b.dataset.ver); var on = c.dataset.on === '1'; c.textContent = on ? '••••••••' : c.dataset.secret; c.dataset.on = on ? '0' : '1'; b.textContent = on ? 'Ver' : 'Ocultar'; }
      });
    })();
  </script>
</body>
</html>
